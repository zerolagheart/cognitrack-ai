name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg
      - name: Install (CPU torch for the PyTorch MLP / attention fusion)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[audio,dev]" torch
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -m "not slow" -q
      - name: Integration tests (tiny synthetic pipeline + API on SQLite)
        run: pytest -m slow -q

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cognitrack
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cognitrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cognitrack" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - run: pip install -e ".[dev]"
      - name: API tests against PostgreSQL
        env:
          COGNITRACK_TEST_DATABASE_URL: postgresql+psycopg://cognitrack:ci-only-password@localhost:5432/cognitrack
        run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build backend image
        run: docker build -t cognitrack-backend .

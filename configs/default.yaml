# CogniTrack AI — default pipeline configuration.
# All relative paths are resolved against the repository root (or $COGNITRACK_ROOT).
# Override with: cognitrack <command> --config configs/my_config.yaml
# DVC tracks this file as the parameter source for every pipeline stage (see dvc.yaml).

project:
  name: cognitrack-ai
  seed: 42
  # Active dataset adapter(s) used by `cognitrack ingest`.
  datasets: [synthetic]

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  synthetic: data/synthetic
  artifacts: artifacts
  models: artifacts/models
  # Machine-readable evaluation/monitoring outputs (JSON, HTML) consumed by the API.
  report_data: artifacts/reports
  # Human-readable generated Markdown reports.
  reports: docs/reports
  mlruns: mlruns
  model_cache: artifacts/checkpoints

datasets:
  synthetic:
    adapter: synthetic
    root: data/synthetic
  adresso:
    adapter: adresso
    # Obtain through DementiaBank / TalkBank membership; never commit.
    root: data/raw/ADReSSo
  adress_m:
    adapter: adress_m
    root: data/raw/ADReSS-M
  dementiabank:
    adapter: dementiabank
    root: data/raw/DementiaBank

synthetic:
  n_participants: 72
  sessions_min: 3
  sessions_max: 6
  # Fraction of synthetic participants given a latent "change" trajectory.
  change_fraction: 0.4
  session_duration_s: [18.0, 30.0]
  sample_rate: 16000
  session_interval_days: [60, 120]
  # Probability that a session is skipped (exercises missing-session handling).
  missing_session_prob: 0.08
  noise_snr_db: [15.0, 35.0]

audio:
  target_sample_rate: 16000
  min_duration_s: 2.0
  max_duration_s: 1200.0
  clipping_level: 0.999
  max_clipping_fraction: 0.01
  silence_floor_dbfs: -50.0
  min_snr_db: 5.0
  frame_ms: 25
  hop_ms: 10
  # Frames whose energy is within this many dB of the recording's loud frames count as voiced.
  vad_relative_threshold_db: 28.0
  min_pause_s: 0.25
  long_pause_s: 2.0
  f0_min_hz: 65.0
  f0_max_hz: 400.0
  n_mfcc: 13
  # auto: use openSMILE eGeMAPS if installed, otherwise librosa approximations.
  opensmile: auto

transcription:
  # When false, dataset-provided transcripts are used and missing ones stay missing.
  enabled: false
  checkpoint: openai/whisper-tiny.en
  revision: main
  device: auto
  chunk_length_s: 30

nlp:
  spacy_model: en_core_web_sm
  sentence_model: sentence-transformers/all-MiniLM-L6-v2
  # Requires `pip install -e .[nlp]` and `cognitrack download-models --nlp`.
  use_sentence_transformers: false
  filler_words: [um, uh, er, ah, erm, hmm, mm, like, "you know", "i mean", well]

embeddings:
  # spectral_stats is a CPU-only, download-free encoder for demo mode.
  encoder: spectral_stats
  batch_size: 4
  device: auto
  max_seconds: 30.0
  encoders:
    spectral_stats:
      n_mels: 64
    hubert:
      checkpoint: facebook/hubert-base-ls960
      revision: main
      layer: -1
    wav2vec2:
      checkpoint: facebook/wav2vec2-base
      revision: main
      layer: -1

split:
  test_size: 0.2
  val_size: 0.2
  # Label used for supervised learning (binary). Rows with missing labels are excluded, never imputed.
  label_column: assessment_label
  positive_label: cognitive_impairment

training:
  cv_folds: 5
  models: [logreg, random_forest, xgboost, lightgbm, mlp]
  # Modality sets for the ablation study. Names refer to feature groups in ml/features/registry.py.
  modality_sets:
    acoustic: [acoustic]
    linguistic: [linguistic]
    conversational: [conversational]
    embedding: [embedding]
    acoustic_linguistic: [acoustic, linguistic]
    acoustic_embedding: [acoustic, embedding]
    full: [acoustic, linguistic, conversational, embedding]
  fusion_strategies: [early, late]
  late_fusion_base_models: [logreg, lightgbm]
  # Attention fusion trains a small PyTorch network; enabled only if torch is installed.
  attention_fusion: true
  # auto: sigmoid (Platt) for small calibration sets, isotonic when >= 300 validation recordings.
  calibration: auto
  # Serving model chosen by participant-grouped CV score on the training partition, never by test metrics.
  selection_metric: auroc
  mlp:
    hidden_dims: [64, 32]
    dropout: 0.2
    epochs: 150
    lr: 0.001
    weight_decay: 0.0001
    batch_size: 32
    patience: 15

evaluation:
  n_bootstrap: 300
  ci_level: 0.95
  calibration_bins: 10
  # Predictions whose calibrated probability lies inside this band are flagged "abstain / refer to clinician review".
  abstention_band: [0.35, 0.65]
  ensemble_disagreement_threshold: 0.2
  ood_quantile: 0.99
  min_subgroup_size: 20
  robustness:
    snr_db: [20, 10, 5]
    gain_db: [-12, 6]
    resample_hz: [8000]
    n_recordings: 40

longitudinal:
  baseline_sessions: 2
  min_sessions: 3
  z_threshold: 2.0
  moving_average_window: 3
  ewma_lambda: 0.3
  ewma_l: 2.7
  changepoint_penalty: 3.0
  bocpd_hazard: 0.1
  isolation_forest_contamination: 0.05
  tracked_features:
    - speech_rate_wpm
    - pause_rate_per_min
    - f0_std_semitones
    - type_token_ratio
    - mean_response_latency_s
    - semantic_coherence

monitoring:
  # Reference = training partition features; current = newly processed recordings.
  psi_bins: 10
  psi_alert: 0.2
  ks_alpha: 0.01

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitrack-ai"
version = "0.1.0"
description = "Multimodal longitudinal speech intelligence for early cognitive change assessment (research prototype, not a medical device)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CogniTrack AI contributors" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pandera>=0.20",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "shap>=0.45",
    "ruptures>=1.1.9",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "nltk>=3.8",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "mlflow>=2.12",
    "evidently>=0.4.30",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0.25",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
]

[project.optional-dependencies]
# openSMILE eGeMAPS functionals (jitter / shimmer / HNR). Optional: a librosa approximation is used otherwise.
audio = ["opensmile>=2.5"]
# spaCy parsing and sentence-transformer coherence. Optional: rule-based fallbacks are used otherwise.
nlp = ["spacy>=3.7", "sentence-transformers>=2.6"]
# Pretrained speech models (Whisper, HuBERT, wav2vec 2.0) and the PyTorch MLP / attention fusion models.
deep = ["torch>=2.2", "torchaudio>=2.2", "transformers>=4.40"]
mlops = ["dvc>=3.48"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.4"]
all = ["cognitrack-ai[audio,nlp,deep,mlops,dev]"]

[project.scripts]
cognitrack = "pipelines.cli:app"

[tool.setuptools.packages.find]
include = ["ml*", "pipelines*", "backend*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["frontend", "notebooks", "data", "artifacts", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
addopts = "-ra -q"
markers = [
    "slow: tests that extract features from audio or train models",
    "requires_deep: tests that need torch/transformers checkpoints",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
